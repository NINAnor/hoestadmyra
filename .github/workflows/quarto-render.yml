on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    # only trigger on main/master branches, not on tags
    branches: [main, master]

name: quarto-render
permissions:
  contents: write
  pull-requests: write
jobs:
  quarto-linux:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Obtain a copy of the repository on the runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # To install LaTeX to build PDF book 
          tinytex: true 

      # Setup pandoc (might be included with Quarto action?) 
      - uses: r-lib/actions/setup-pandoc@v2
      
      # Install Linux system dependencies
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
          
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Restore packages from renv.lock
        uses: r-lib/actions/setup-renv@v2


      # Render the Quarto book using GitHub actions and publish
      # We are using the built-in {{GITHUB_PAT}} environment variable.
      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          #path: _book

